name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build app and Android test APKs
        run: gradle assembleDebug assembleDebugAndroidTest testDebugUnitTest

      - name: Run Room instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          script: |
            adb shell pm list instrumentation
            adb logcat -c
            gradle connectedDebugAndroidTest || {
              mkdir -p app/build/ci-diagnostics
              adb logcat -d -v threadtime > app/build/ci-diagnostics/instrumentation-logcat.txt
              adb shell dumpsys package com.oldgameshub.app > app/build/ci-diagnostics/app-package.txt
              adb shell dumpsys package com.oldgameshub.app.test > app/build/ci-diagnostics/test-package.txt
              exit 1
            }

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics
          path: app/build/ci-diagnostics/
          if-no-files-found: ignore
